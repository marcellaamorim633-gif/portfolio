<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AS Analytics</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='index.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="container">

        <!-- LADO ESQUERDO -->

        <div class="left">

            <img src="{{ url_for('static', filename='img/logotech.png') }}"
                 class="logo-login">

            <h1>
                Insights que transformam
                <br>
                dados em <span>resultados.</span>
            </h1>

            <p>
                Plataforma completa para gestão inteligente através
                de KPIs, Dashboards e Business Intelligence.
            </p>

            <div class="features">

                <div class="feature">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Dashboards</span>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>KPIs</span>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-database"></i>
                    <span>Banco de Dados</span>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>Excel</span>
                </div>

            </div>

        </div>

        <!-- LADO DIREITO -->

        <div class="right">

            <div class="card">

                <img src="{{ url_for('static', filename='img/logotech.png') }}"
                     class="logo-login">

                <h2>Bem-vindo ao AS Analytics</h2>

                <form action="{{ url_for('login') }}" method="POST">

                    <label>E-mail Corporativo</label>
                
                    <div class="input">
                
                        <i class="fa-solid fa-envelope"></i>
                
                        <input
                            type="email"
                            name="email"
                            placeholder="usuario@empresa.com.br"
                            autocomplete="email"
                            required>
                
                    </div>
                
                    <label>Senha</label>
                
                    <div class="input">
                
                        <i class="fa-solid fa-lock"></i>
                
                        <input
                            type="password"
                            name="senha"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required>
                
                    </div>
                
                    <div class="options">
                
                        <label>
                
                            <input type="checkbox" name="lembrar">
                
                            Lembrar-me
                
                        </label>
                
                        <a href="{{ url_for('recuperar') }}">
                            Esqueceu a senha?
                        </a>
                
                    </div>
                
                    <button type="submit">
                        ACESSAR
                    </button>
                
                </form>

                <div class="register">

                    <span>É novo?</span>

                    <a href="{{ url_for('cadastro') }}">Cadastre-se</a>

                </div>

                <div class="card-footer">

                    © AS Tech 2026

                </div>

            </div>

        </div>

    </div>

</body>
</html>
