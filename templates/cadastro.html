<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | AS Analytics</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='index.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="container">

        <!-- LADO ESQUERDO -->

        <div class="left">

            <img src="{{ url_for('static', filename='img/logotech.png') }}"
                 class="logo-login">

            <h1>
                Comece a transformar
                <br>
                dados em <span>resultados.</span>
            </h1>

            <p>
                Crie sua conta e tenha acesso a dashboards,
                KPIs, Business Intelligence e análises inteligentes.
            </p>

            <div class="features">

                <div class="feature">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Dashboards</span>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>KPIs</span>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-database"></i>
                    <span>Banco de Dados</span>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>Excel</span>
                </div>

            </div>

        </div>

        <!-- LADO DIREITO -->

        <div class="right">

            <div class="card">

                <img src="{{ url_for('static', filename='img/logotech.png') }}"
                     class="logo-login">

                <h2>Criar Conta</h2>

                <form action="{{ url_for('cadastro') }}" method="POST">

                    <label>Nome Completo</label>

                    <div class="input">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            name="nome"
                            placeholder="Digite seu nome"
                            required>

                    </div>

                    <label>Empresa</label>

                    <div class="input">

                        <i class="fa-solid fa-building"></i>

                        <input
                            type="text"
                            name="empresa"
                            placeholder="Nome da empresa">

                    </div>

                    <label>E-mail Corporativo</label>

                    <div class="input">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            name="email"
                            placeholder="usuario@empresa.com.br"
                            required>

                    </div>

                    <label>Senha</label>

                    <div class="input">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="senha"
                            placeholder="••••••••"
                            required>

                    </div>

                    <label>Confirmar Senha</label>

                    <div class="input">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="confirmar_senha"
                            placeholder="••••••••"
                            required>

                    </div>

                    <div class="options">

                        <label>

                            <input
                                type="checkbox"
                                required>

                            Aceito os termos de uso

                        </label>

                    </div>

                    <button type="submit">

                        CRIAR CONTA

                    </button>

                </form>

                <div class="register">

                    <span>Já possui uma conta?</span>

                    <a href="{{ url_for('login') }}">

                        Entrar

                    </a>

                </div>

                <div class="card-footer">

                    © AS Tech 2026

                </div>

            </div>

        </div>

    </div>

</body>
</html>
